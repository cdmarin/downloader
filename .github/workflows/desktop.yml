name: Windows App

on:
  push:
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'server.js'
      - '.github/workflows/desktop.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Downloads Electron plus the Windows yt-dlp.exe and ffmpeg.exe that get bundled.
      # The token avoids GitHub's anonymous API rate limit when fetching yt-dlp.
      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A tag like v1.2 becomes app version 1.2.0
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          while [ "$(echo "$version" | tr -cd . | wc -c)" -lt 2 ]; do version="$version.0"; done
          npm pkg set version="$version"

      - name: Build installer and portable .exe
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSaver-windows
          path: desktop/dist/*.exe

      # Pushing a tag like v1.2 (or running this workflow on that tag) adds the .exe files to its Release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
